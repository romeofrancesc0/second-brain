<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: vault:; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self' ws://localhost:* http://localhost:*"
    />
    <title>Second Brain</title>
  </head>
  <body>
    <div id="app">
      <div id="stage"></div>
      <div id="labels"></div>
      <div class="vignette"></div>

      <header class="titlebar">
        <div class="brand">
          <span class="logo"></span>
          <span class="brand-name">Second Brain</span>
          <button id="vault-btn" class="vault-pill" title="Cambia vault"></button>
        </div>
        <div id="stats" class="stats"></div>
        <div class="title-actions">
          <button id="agent-btn" class="agent-trigger" title="Agente AI (⌘J)"></button>
          <button id="search-btn" class="search-trigger" title="Cerca (⌘K)"></button>
          <button id="home-btn" class="icon-btn" title="Vista d'insieme (H)"></button>
          <button id="settings-btn" class="icon-btn" title="Impostazioni"></button>
        </div>
      </header>

      <aside id="legend" class="glass legend"></aside>
      <aside id="agent" class="glass agent-panel hidden"></aside>
      <aside id="panel" class="glass panel hidden"></aside>
      <div id="settings" class="glass popover hidden"></div>
      <div id="palette" class="palette-backdrop hidden"></div>

      <div id="progress" class="progress hidden">
        <div class="bar"><i></i></div>
        <span>Lettura del vault…</span>
      </div>
      <div class="hint">
        <span><kbd>trascina</kbd> ruota</span>
        <span><kbd>scroll</kbd> zoom</span>
        <span><kbd>W A S D</kbd> vola</span>
        <span><kbd>click</kbd> apri neurone</span>
        <span><kbd>H</kbd> vista d'insieme</span>
      </div>
      <div id="toast" class="toast hidden"></div>
      <div id="welcome" class="welcome hidden"></div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
